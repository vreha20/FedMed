# FedMed configuration
# Central place for all hyperparameters — change values here, not in code

data:
  root_dir: "data/brats_mini"
  modalities: ["t1", "t1ce", "t2", "flair"]  # 4 input channels
  image_size: [64, 64, 64]                 # resized volume dims
  train_split: 0.8

model:
  in_channels: 4          # 4 MRI modalities stacked
  out_channels: 3          # tumor sub-regions (or 2 for binary: tumor / no tumor)
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]

training:
  batch_size: 4            # small — CPU/Colab-free-tier realistic
  epochs: 30
  learning_rate: 0.0001
  optimizer: "Adam"

federated:
  num_clients: 3
  rounds: 10
  local_epochs: 2

privacy:
  encryption: "tenseal"
  dp_noise_multiplier: 1.0
  dp_epsilon: 8.0